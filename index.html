<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📅 Calendrier de Stage — Médecine 2025/2026</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root{
    --bg1:#0a0e27;
    --bg2:#1a1f4a;
    --accent:#00e5ff;
    --accent2:#ff00e5;
    --gold:#ffd700;
    --stage-a:#00ff88;
    --stage-b:#ff6b6b;
    --intern:#ffaa00;
  }

  body{
    font-family:'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #0a0e27 0%, #1a1f4a 50%, #0a0e27 100%);
    background-size: 400% 400%;
    animation: bgShift 15s ease infinite;
    min-height:100vh;
    color:#fff;
    overflow-x:hidden;
  }

  @keyframes bgShift{
    0%,100%{background-position:0% 50%}
    50%{background-position:100% 50%}
  }

  /* نجوم متحركة في الخلفية */
  body::before{
    content:'';
    position:fixed;
    inset:0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, #fff, transparent),
      radial-gradient(2px 2px at 60% 70%, #fff, transparent),
      radial-gradient(1px 1px at 50% 50%, #fff, transparent),
      radial-gradient(1px 1px at 80% 10%, #fff, transparent),
      radial-gradient(2px 2px at 90% 60%, #fff, transparent),
      radial-gradient(1px 1px at 33% 80%, #fff, transparent),
      radial-gradient(1px 1px at 15% 90%, #fff, transparent);
    background-size:200% 200%;
    animation: stars 60s linear infinite;
    opacity:.5;
    pointer-events:none;
    z-index:0;
  }
  @keyframes stars{
    from{background-position:0 0}
    to{background-position:200% 200%}
  }

  .container{ position:relative; z-index:1; max-width:1600px; margin:0 auto; padding:20px; }

  /* الهيدر */
  header{
    text-align:center;
    padding:40px 20px 20px;
    position:relative;
  }
  h1{
    font-size:clamp(1.8rem, 5vw, 3.2rem);
    font-weight:900;
    background:linear-gradient(90deg, var(--accent), var(--accent2), var(--gold), var(--accent));
    background-size:300% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation: gradientText 4s linear infinite;
    text-shadow: 0 0 40px rgba(0,229,255,.4);
    letter-spacing:2px;
  }
  @keyframes gradientText{
    0%{background-position:0% 50%}
    100%{background-position:300% 50%}
  }
  .subtitle{
    margin-top:10px;
    color:#a0b4d0;
    font-size:1.05rem;
    letter-spacing:3px;
    text-transform:uppercase;
  }

  /* أزرار التبديل */
  .toggle-wrap{
    display:flex;
    justify-content:center;
    gap:15px;
    margin:30px 0;
    flex-wrap:wrap;
  }
  .toggle-btn{
    padding:14px 34px;
    border:2px solid var(--accent);
    background:rgba(0,229,255,.08);
    color:var(--accent);
    font-size:1rem;
    font-weight:700;
    border-radius:50px;
    cursor:pointer;
    transition:.4s;
    letter-spacing:1px;
    position:relative;
    overflow:hidden;
  }
  .toggle-btn::before{
    content:'';
    position:absolute;
    top:50%; left:50%;
    width:0; height:0;
    background:radial-gradient(circle, var(--accent), transparent);
    transform:translate(-50%,-50%);
    transition:.5s;
    opacity:.4;
    border-radius:50%;
  }
  .toggle-btn:hover::before{ width:300px; height:300px; }
  .toggle-btn.active{
    background:var(--accent);
    color:#0a0e27;
    box-shadow:0 0 30px var(--accent), 0 0 60px rgba(0,229,255,.5);
    transform:scale(1.05);
  }
  .toggle-btn.active-b{
    border-color:var(--stage-b);
    background:rgba(255,107,107,.08);
    color:var(--stage-b);
  }
  .toggle-btn.active-b.active{
    background:var(--stage-b);
    color:#0a0e27;
    box-shadow:0 0 30px var(--stage-b), 0 0 60px rgba(255,107,107,.5);
  }

  /* عنوان المجموعة */
  .group-title{
    text-align:center;
    font-size:1.4rem;
    margin:20px 0 30px;
    color:var(--gold);
    letter-spacing:2px;
    animation: pulseGlow 2s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{ text-shadow:0 0 10px rgba(255,215,0,.5); }
    50%{ text-shadow:0 0 30px rgba(255,215,0,1), 0 0 50px rgba(255,215,0,.6); }
  }

  /* حاوية كل الأشهر (الشبكة الكبيرة) */
  .year-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    margin-top: 20px;
  }

  /* بطاقة الشهر */
  .month-card {
    background: rgba(20,25,60,.6);
    border: 1px solid rgba(0,229,255,.2);
    border-radius: 16px;
    padding: 15px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 30px rgba(0,229,255,.1);
    transition: .3s;
    animation: fadeInUp .6s ease;
  }
  .month-card:hover {
    border-color: rgba(0,229,255,.6);
    box-shadow: 0 0 40px rgba(0,229,255,.25);
    transform: translateY(-5px);
  }

  .month-title {
    text-align: center;
    font-size: 1.2rem;
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 0 15px rgba(0,229,255,.5);
  }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7,1fr);
    gap: 2px;
    margin-bottom: 6px;
    text-align: center;
  }
  .weekdays div {
    font-size: 0.65rem;
    font-weight: 700;
    color: #6a8aa8;
    padding: 4px 0;
    text-transform: uppercase;
  }

  .days-grid {
    display: grid;
    grid-template-columns: repeat(7,1fr);
    gap: 2px;
  }

  .day {
    aspect-ratio: 1;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 600;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.05);
    color: #8a9ab0;
    position: relative;
    transition: .2s;
    cursor: default;
  }
  .day.empty { background: transparent; border: none; }
  
  /* تمييز أيام السطاج */
  .day.stage {
    cursor: pointer;
    background: linear-gradient(135deg, rgba(0,255,136,.3), rgba(0,229,255,.2));
    border: 1px solid var(--stage-a);
    box-shadow: 0 0 10px rgba(0,255,136,.4);
    color: #fff;
    font-weight: 800;
    animation: stagePulse 2s ease-in-out infinite;
    z-index: 2;
  }
  .day.stage:hover {
    transform: scale(1.25);
    box-shadow: 0 0 25px var(--stage-a);
    z-index: 10;
  }
  @keyframes stagePulse {
    0%,100% { box-shadow: 0 0 8px rgba(0,255,136,.4); }
    50% { box-shadow: 0 0 18px rgba(0,255,136,.8); }
  }

  .day.stage-b {
    background: linear-gradient(135deg, rgba(255,107,107,.3), rgba(255,0,229,.2));
    border: 1px solid var(--stage-b);
    box-shadow: 0 0 10px rgba(255,107,107,.4);
    color: #fff;
    font-weight: 800;
    animation: stagePulseB 2s ease-in-out infinite;
  }
  .day.stage-b:hover {
    transform: scale(1.25);
    box-shadow: 0 0 25px var(--stage-b);
    z-index: 10;
  }
  @keyframes stagePulseB {
    0%,100% { box-shadow: 0 0 8px rgba(255,107,107,.4); }
    50% { box-shadow: 0 0 18px rgba(255,107,107,.8); }
  }

  .day.stage-intern {
    background: linear-gradient(135deg, rgba(255,170,0,.35), rgba(255,215,0,.2));
    border: 1px solid var(--intern);
    box-shadow: 0 0 10px rgba(255,170,0,.5);
    color: #fff;
    font-weight: 800;
    animation: stagePulseI 2s ease-in-out infinite;
  }
  .day.stage-intern:hover {
    transform: scale(1.25);
    box-shadow: 0 0 25px var(--intern);
    z-index: 10;
  }
  @keyframes stagePulseI {
    0%,100% { box-shadow: 0 0 8px rgba(255,170,0,.4); }
    50% { box-shadow: 0 0 18px rgba(255,170,0,.8); }
  }

  /* الأيقونة داخل اليوم */
  .day .icon {
    position: absolute;
    top: -4px;
    right: -4px;
    font-size: 0.8rem;
    filter: drop-shadow(0 0 3px #fff);
    animation: iconBounce 1.5s ease-in-out infinite;
  }
  @keyframes iconBounce {
    0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-3px) scale(1.2); }
  }

  /* المودال */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(5,8,20,.85);
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
    opacity:0;
    transition:opacity .3s;
  }
  .modal-overlay.show{ display:flex; opacity:1; }

  .modal{
    background:linear-gradient(145deg, #151a3a, #0d1230);
    border:2px solid var(--accent);
    border-radius:24px;
    padding:40px 30px;
    max-width:520px;
    width:100%;
    text-align:center;
    position:relative;
    box-shadow:0 0 80px rgba(0,229,255,.5), inset 0 0 40px rgba(0,229,255,.08);
    animation: modalPop .5s cubic-bezier(.68,-0.55,.27,1.55);
    overflow:hidden;
  }
  .modal::before{
    content:'';
    position:absolute;
    top:-50%; left:-50%;
    width:200%; height:200%;
    background:conic-gradient(from 0deg, transparent, rgba(0,229,255,.15), transparent, rgba(255,0,229,.15), transparent);
    animation: rotateGlow 6s linear infinite;
    z-index:0;
  }
  @keyframes rotateGlow{ to{ transform:rotate(360deg); } }
  @keyframes modalPop{
    from{ opacity:0; transform:scale(.7) translateY(30px); }
    to{ opacity:1; transform:scale(1) translateY(0); }
  }
  .modal > *{ position:relative; z-index:1; }

  .modal .close-btn{
    position:absolute;
    top:15px; right:18px;
    background:none;
    border:none;
    color:#fff;
    font-size:1.8rem;
    cursor:pointer;
    transition:.3s;
    line-height:1;
  }
  .modal .close-btn:hover{ color:var(--accent2); transform:rotate(90deg) scale(1.2); }

  .modal .modal-icon{
    font-size:4rem;
    margin-bottom:10px;
    animation: floatIcon 3s ease-in-out infinite;
    filter:drop-shadow(0 0 20px var(--gold));
  }
  @keyframes floatIcon{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-12px); }
  }

  .modal h2{
    font-size:1.6rem;
    color:var(--gold);
    margin-bottom:6px;
    text-shadow:0 0 20px rgba(255,215,0,.6);
  }
  .modal .full-date{
    color:var(--accent);
    font-size:1.1rem;
    margin-bottom:20px;
    font-weight:600;
    letter-spacing:1px;
  }
  .modal .info-line{
    background:rgba(0,229,255,.08);
    border-left:4px solid var(--accent);
    border-radius:10px;
    padding:14px 18px;
    margin:12px 0;
    text-align:left;
    display:flex;
    align-items:center;
    gap:12px;
    font-size:1rem;
    animation: slideIn .5s ease;
  }
  @keyframes slideIn{
    from{ opacity:0; transform:translateX(-20px); }
    to{ opacity:1; transform:translateX(0); }
  }
  .modal .info-line .label{
    color:#8aa0c0;
    font-size:.8rem;
    text-transform:uppercase;
    letter-spacing:1px;
    display:block;
    margin-bottom:2px;
  }
  .modal .info-line .value{
    color:#fff;
    font-weight:700;
    font-size:1.05rem;
  }
  .modal .info-line .emoji{ font-size:1.6rem; }

  /* مؤشر ألوان */
  .legend{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
    margin-top:25px;
    font-size:.85rem;
    color:#a0b4d0;
    padding-bottom: 40px;
  }
  .legend span{ display:flex; align-items:center; gap:6px; }
  .dot{ width:14px; height:14px; border-radius:50%; display:inline-block; }

  @keyframes fadeInUp{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* استجابة الجوال */
  @media(max-width:600px){
    .year-grid{ grid-template-columns: 1fr; }
    .day { font-size: 0.75rem; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>✦ CALENDRIER DE STAGE ✦</h1>
    <p class="subtitle">Médecine — Planning 2025/2026</p>
  </header>

  <div class="toggle-wrap">
    <button class="toggle-btn active" id="btnA" onclick="switchGroup('A')">SOUS GROUPE A</button>
    <button class="toggle-btn active-b" id="btnB" onclick="switchGroup('B')">SOUS GROUPE B</button>
  </div>

  <div class="group-title" id="groupTitle">— SOUS GROUPE A —</div>

  <!-- هنا سيتم توليد كل الأشهر -->
  <div class="year-grid" id="yearGrid"></div>

  <div class="legend">
    <span><i class="dot" style="background:var(--stage-a);box-shadow:0 0 10px var(--stage-a)"></i> Stage Groupe A</span>
    <span><i class="dot" style="background:var(--stage-b);box-shadow:0 0 10px var(--stage-b)"></i> Stage Groupe B</span>
    <span><i class="dot" style="background:var(--intern);box-shadow:0 0 10px var(--intern)"></i> Médecine Interne (commun)</span>
  </div>
</div>

<!-- المودال -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script>
/* ============ البيانات ============ */

// سطاج Médecine Interne (مشترك للاثنين)
const interneStages = [
  { start:'2025-11-15', end:'2025-11-16', place:'Medecine Interne — Douira' },
  { start:'2026-03-02', end:'2026-03-03', place:'Medecine Interne — Douira' },
  { start:'2025-11-29', end:'2025-11-30', place:'Medecine Interne — Blida' },
  { start:'2026-04-06', end:'2026-04-07', place:'Medecine Interne — Blida' },
];

// Sous Groupe A
const groupA = [
  { start:'2025-11-02', end:'2025-11-04', place:'Psychiatrie C — CHU Blida Ibn Badis' }, // تم التعديل
  { start:'2025-12-13', end:'2025-12-16', place:'MPR — Blida' },
  { start:'2026-01-10', end:'2026-01-13', place:'Chirurgie Orthopédique — Douira A' },
  { start:'2026-01-24', end:'2026-01-27', place:'Chirurgie Pédiatrique — Blida' },
  { start:'2026-02-07', end:'2026-02-10', place:'Anesthésie Réanimation — TOT Blida' },
  { start:'2026-03-14', end:'2026-03-17', place:'Chirurgie Maxillo-Faciale — CHU Douira' },
  { start:'2026-04-11', end:'2026-04-14', place:'Chirurgie Générale — CHU Douira' },
  { start:'2026-02-21', end:'2026-02-24', place:'Pédiatrie — CHU Blida' },
  { start:'2026-04-25', end:'2026-05-02', place:'Gynécologie — CHU Blida' },
  { start:'2026-05-09', end:'2026-05-12', place:'Chirurgie Orthopédique — CHU Blida' },
];

// Sous Groupe B
const groupB = [
  { start:'2025-11-02', end:'2025-11-04', place:'Psychiatrie D — CHU Blida' }, // تم التعديل
  { start:'2025-12-13', end:'2025-12-16', place:'MPR — Douira' },
  { start:'2026-01-10', end:'2026-01-13', place:'Chirurgie Orthopédique — Douira B' },
  { start:'2026-01-24', end:'2026-01-27', place:'Chirurgie CAC — Blida' },
  { start:'2026-02-07', end:'2026-02-10', place:'Néphrologie — TOT Blida' },
  { start:'2026-02-21', end:'2026-02-24', place:'Pédiatrie — CHU Douira' },
  { start:'2026-03-14', end:'2026-03-17', place:'UMC — CHU Douira' },
  { start:'2026-04-11', end:'2026-04-14', place:'Chirurgie Générale — CHU Blida' },
  { start:'2026-04-25', end:'2026-05-02', place:'Gynécologie — CHU Douira' },
  { start:'2026-05-09', end:'2026-05-12', place:'Rhumatologie — CHU Douira' },
];

let currentGroup = 'A';

/* ============ أدوات التواريخ ============ */
const MONTHS_FR = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DAYS_FR = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];

function parseDate(str){ const [y,m,d]=str.split('-').map(Number); return new Date(y, m-1, d); }
function toKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function formatFullDate(d){
  return `${DAYS_FR[d.getDay()]} ${d.getDate()} ${MONTHS_FR[d.getMonth()]} ${d.getFullYear()}`;
}

// بناء خريطة الأيام -> الأحداث
function buildDayMap(){
  const map = {};
  function addRange(list, type){
    list.forEach(ev => {
      const s = parseDate(ev.start), e = parseDate(ev.end);
      let cur = new Date(s);
      while(cur <= e){
        const k = toKey(cur);
        if(!map[k]) map[k] = [];
        map[k].push({ type, place: ev.place, date: new Date(cur) });
        cur.setDate(cur.getDate()+1);
      }
    });
  }
  addRange(interneStages, 'intern');
  addRange(currentGroup === 'A' ? groupA : groupB, currentGroup === 'A' ? 'A' : 'B');
  return map;
}

let dayMap = buildDayMap();

/* ============ بناء تقويم كل السنة ============ */
function renderFullYear(){
  const yearGrid = document.getElementById('yearGrid');
  yearGrid.innerHTML = '';

  // السنة الدراسية: من سبتمبر 2025 إلى أوت 2026
  const monthsToShow = [
    { year: 2025, month: 8 },  // Septembre 2025
    { year: 2025, month: 9 },  // Octobre
    { year: 2025, month: 10 }, // Novembre
    { year: 2025, month: 11 }, // Décembre
    { year: 2026, month: 0 },  // Janvier 2026
    { year: 2026, month: 1 },  // Février
    { year: 2026, month: 2 },  // Mars
    { year: 2026, month: 3 },  // Avril
    { year: 2026, month: 4 },  // Mai
    { year: 2026, month: 5 },  // Juin
    { year: 2026, month: 6 },  // Juillet
    { year: 2026, month: 7 },  // Août
  ];

  monthsToShow.forEach(m => {
    const monthCard = document.createElement('div');
    monthCard.className = 'month-card';

    const title = document.createElement('div');
    title.className = 'month-title';
    title.textContent = `${MONTHS_FR[m.month]} ${m.year}`;
    monthCard.appendChild(title);

    const weekdays = document.createElement('div');
    weekdays.className = 'weekdays';
    ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'].forEach(d => {
      const wd = document.createElement('div');
      wd.textContent = d;
      weekdays.appendChild(wd);
    });
    monthCard.appendChild(weekdays);

    const daysGrid = document.createElement('div');
    daysGrid.className = 'days-grid';

    const firstDay = new Date(m.year, m.month, 1);
    const lastDay = new Date(m.year, m.month+1, 0);
    const startOffset = firstDay.getDay();
    const totalDays = lastDay.getDate();

    // أيام فارغة
    for(let i=0; i<startOffset; i++){
      const el = document.createElement('div');
      el.className = 'day empty';
      daysGrid.appendChild(el);
    }

    // أيام الشهر
    for(let day=1; day<=totalDays; day++){
      const dateObj = new Date(m.year, m.month, day);
      const key = toKey(dateObj);
      const events = dayMap[key] || [];

      const el = document.createElement('div');
      el.className = 'day';
      el.textContent = day;

      if(events.length > 0){
        const hasIntern = events.some(e=>e.type==='intern');
        const hasGroup = events.some(e=>e.type==='A'||e.type==='B');

        if(hasIntern && !hasGroup){ el.classList.add('stage-intern'); }
        else if(hasGroup){
          if(events.some(e=>e.type==='A')) el.classList.add('stage');
          if(events.some(e=>e.type==='B')) el.classList.add('stage-b');
        }
        if(hasIntern && hasGroup) el.classList.add('stage-intern');

        const icon = document.createElement('span');
        icon.className = 'icon';
        icon.textContent = hasIntern && hasGroup ? '⭐' : (hasIntern ? '🏥' : '📚');
        el.appendChild(icon);

        el.addEventListener('click', ()=> openModal(key, events));
      }

      daysGrid.appendChild(el);
    }

    monthCard.appendChild(daysGrid);
    yearGrid.appendChild(monthCard);
  });
}

/* ============ المودال ============ */
function openModal(key, events){
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');

  const dateObj = parseDate(key);
  const fullDate = formatFullDate(dateObj);
  const dayName = DAYS_FR[dateObj.getDay()];

  let html = `
    <button class="close-btn" onclick="closeModal()">×</button>
    <div class="modal-icon">${events.some(e=>e.type==='intern') ? '🏥' : '📚'}</div>
    <h2>${dayName}</h2>
    <div class="full-date">${fullDate}</div>
  `;

  const seen = new Set();
  events.forEach(ev => {
    const uid = ev.place + '|' + ev.type;
    if(seen.has(uid)) return;
    seen.add(uid);

    let emoji = '📖', label = 'Stage';
    if(ev.type === 'intern'){ emoji = '🏥'; label = 'Médecine Interne'; }
    else if(ev.type === 'A'){ emoji = '📚'; label = 'Sous Groupe A'; }
    else if(ev.type === 'B'){ emoji = '📚'; label = 'Sous Groupe B'; }

    html += `
      <div class="info-line">
        <span class="emoji">${emoji}</span>
        <div>
          <span class="label">${label}</span>
          <span class="value">${ev.place}</span>
        </div>
      </div>
    `;
  });

  content.innerHTML = html;
  overlay.classList.add('show');
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
}

document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* ============ التبديل بين المجموعات ============ */
function switchGroup(g){
  currentGroup = g;
  dayMap = buildDayMap();

  const btnA = document.getElementById('btnA');
  const btnB = document.getElementById('btnB');
  const title = document.getElementById('groupTitle');

  if(g === 'A'){
    btnA.classList.add('active');
    btnB.classList.remove('active');
    title.textContent = '— SOUS GROUPE A —';
    title.style.color = 'var(--gold)';
  } else {
    btnB.classList.add('active');
    btnA.classList.remove('active');
    title.textContent = '— SOUS GROUPE B —';
    title.style.color = 'var(--stage-b)';
  }

  renderFullYear();
}

/* ============ التشغيل ============ */
renderFullYear();
</script>
